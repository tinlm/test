<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wildwalk</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Mission Control: black ground, white hairlines, wide-tracked caps, mono readouts. Ice blue marks only the epic tier. */
  :root{--bg:#000;--panel:#07090c;--line:#2a3038;--hi:#ffffff66;--text:#f2f4f6;--muted:#7d8791;--ice:#8fd3ff;
        --sans:'Barlow',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
  button{font-family:var(--sans)}
  #map{position:absolute;inset:0;background:#050608}
  .maplibregl-ctrl-bottom-right{bottom:70px}
  .maplibregl-ctrl-attrib.maplibregl-compact{background:#000a}
  .maplibregl-ctrl-attrib-button{filter:invert(1)}
  .maplibregl-ctrl-attrib a{color:#b5bec7}
  .maplibregl-ctrl-attrib-inner{color:#8a949e}

  .hud{position:absolute;top:0;left:0;right:0;z-index:1000;padding:max(10px,env(safe-area-inset-top)) 10px 0;pointer-events:none}
  .panel{pointer-events:auto;background:#000d;border:1px solid var(--hi);padding:9px 12px 8px;backdrop-filter:blur(6px)}
  .r1{display:flex;align-items:center;gap:12px}
  .lvl,.orbs{font:500 12px var(--mono);letter-spacing:.18em;white-space:nowrap}
  .bar{flex:1;height:2px;background:#ffffff26}
  .bar i{display:block;height:100%;width:0;background:#fff;transition:width .4s}
  .mh{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font:400 9px var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .mq{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:5px;cursor:pointer}
  .mq .t{font:500 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mq .d{font:500 11px var(--mono);letter-spacing:.1em;white-space:nowrap;color:#fff}

  .corner{position:absolute;z-index:900;width:16px;height:16px;border:1px solid #ffffffaa;pointer-events:none}
  .c1{top:calc(max(10px,env(safe-area-inset-top)) + 112px);left:10px;border-right:0;border-bottom:0}
  .c2{top:calc(max(10px,env(safe-area-inset-top)) + 112px);right:10px;border-left:0;border-bottom:0}
  .c3{bottom:76px;left:10px;border-right:0;border-top:0}
  .c4{bottom:76px;right:10px;border-left:0;border-top:0}

  .nav{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:flex;gap:8px;padding:10px 10px max(12px,env(safe-area-inset-bottom));pointer-events:none}
  .nav button{pointer-events:auto;flex:1;background:#000d;color:var(--text);border:1px solid var(--hi);padding:14px 4px;font:500 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;backdrop-filter:blur(6px)}
  .nav button.on{background:#fff;color:#000;border-color:#fff}
  .hint{position:absolute;left:10px;right:10px;bottom:70px;z-index:1000;text-align:center;font:400 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#000c;border:1px solid var(--line);padding:6px 10px;pointer-events:none;display:none}

  /* markers */
  .me{position:relative;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000;pointer-events:none}
  .me::after{content:"";position:absolute;inset:-9px;border:1px solid #fff;border-radius:50%;animation:ping 2.4s ease-out infinite}
  @keyframes ping{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
  .cr{position:relative;width:40px;height:40px;cursor:pointer}
  .cr i{position:absolute;inset:7px;border:1px solid #fff;background:#000;transform:rotate(45deg)}
  .cr.r3 i{box-shadow:0 0 0 3px #000,0 0 0 4px #fff}
  .cr.r4 i{border-color:var(--ice);box-shadow:0 0 0 3px #000,0 0 0 4px var(--ice)}
  .cr b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400;filter:brightness(0) invert(1)}
  .cr span{display:none;position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000}
  .cr.near{animation:hover 1.6s ease-in-out infinite}
  .cr.near i{background:#fff}
  .cr.near b{filter:brightness(0)}
  .cr.near span{display:block}
  @keyframes hover{50%{transform:translateY(-4px)}}
  .stop{position:relative;width:24px;height:24px;border:1px solid #fff;background:#000;display:grid;place-items:center;font-size:12px;cursor:pointer}
  .stop b{font-weight:400;filter:brightness(0) invert(1)}
  .stop.near{background:#fff}.stop.near b{filter:brightness(0)}
  .stop.cd{border-color:#666;opacity:.45}
  .stop.target::after{content:"";position:absolute;inset:-8px;border:1px solid #fff;animation:ping 2s ease-out infinite}
  @media (prefers-reduced-motion:reduce){.me::after,.stop.target::after,.cr.near,.beast{animation:none!important}}

  .toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 138px);transform:translate(-50%,-6px);z-index:3000;background:#fff;color:#000;padding:12px 18px;text-align:center;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;font:600 13px var(--sans);letter-spacing:.14em;text-transform:uppercase}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast small{display:block;font:400 10px var(--mono);letter-spacing:.1em;margin-top:4px;text-transform:none}

  .modal,.gate{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  .modal{z-index:2000}.gate{z-index:4000;text-align:center}
  .modal.open,.gate.open{display:flex}
  .gate .eyebrow{font:400 10px var(--mono);letter-spacing:.3em;color:var(--muted);text-transform:uppercase}
  .gate h2{font:500 24px var(--sans);letter-spacing:.2em;text-transform:uppercase}
  .gate p{max-width:34ch;color:var(--muted);font-size:14px;line-height:1.55}
  .info{text-align:center}
  .info b{display:block;font:500 22px var(--sans);letter-spacing:.22em;text-transform:uppercase}
  .info div{color:var(--muted);font:400 11px var(--mono);letter-spacing:.16em;margin-top:6px;text-transform:uppercase}
  .arena{position:relative;width:260px;height:260px}
  .arena>*{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
  .outer{width:250px;height:250px;border:1px solid #ffffff22}
  .target{width:80px;height:80px;border:1px dashed #fff}
  .ring{border:1.5px solid #fff}
  .beast{font-size:54px;z-index:2;filter:brightness(0) invert(1);animation:float 2.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 6px))}}
  .btn{border:0;padding:15px 44px;font:600 13px var(--sans);letter-spacing:.24em;text-transform:uppercase;background:#fff;color:#000}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--hi);padding:11px 24px;font-size:11px}

  .drawer{position:absolute;inset:0;z-index:2500;background:#000;padding:max(16px,env(safe-area-inset-top)) 16px 24px;overflow:auto;display:none}
  .drawer.open{display:block}
  .drawer h1{font:500 22px var(--sans);letter-spacing:.24em;text-transform:uppercase;margin-bottom:2px}
  .drawer .sub{font:400 10px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .x{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top));background:none;border:1px solid var(--hi);color:var(--text);width:36px;height:36px;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}
  .card{border:1px solid var(--line);background:var(--panel);padding:14px 4px 10px;text-align:center;font:400 9px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .card .e{display:block;font-size:34px;line-height:1.2;margin-bottom:8px;filter:brightness(0) invert(1)}
  .card b{display:block;font:500 12px var(--sans);letter-spacing:.18em;color:var(--text);margin-bottom:3px}
  .card .pips{display:block;letter-spacing:.3em;margin-bottom:4px}
  .card.no .e{filter:brightness(0) invert(1) opacity(.14)}
  .card.no b{color:#4a525b}
  .card.r4:not(.no){border-color:var(--ice)}
  .card.r4:not(.no) .pips{color:var(--ice)}
  .row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:13px;margin-top:8px;font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
  .sw{width:42px;height:22px;border:1px solid var(--hi);position:relative}
  .sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;background:#666;transition:.2s}
  .sw.on{border-color:#fff}.sw.on::after{left:22px;background:#fff}
</style>
</head>
<body>
<div id="map"></div>

<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>

<div class="hud"><div class="panel">
  <div class="r1">
    <div class="lvl" id="lvl">LV 01</div>
    <div class="bar"><i id="xpbar"></i></div>
    <div class="orbs" id="orbs">ORB 10</div>
  </div>
  <div class="mh"><span>Missions</span><span id="mode">LOCATING</span></div>
  <div class="mq" id="mq"><span class="t" id="mt">Scanning for missions</span><span class="d" id="md"></span></div>
</div></div>

<div class="hint" id="hint">Sim mode · tap the map to move</div>

<div class="nav">
  <button id="bLoc">Locate</button>
  <button id="bDex">Dex</button>
  <button id="bSim">Sim</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="catch">
  <div class="info"><b id="cName"></b><div id="cSub"></div></div>
  <div class="arena" id="arena">
    <div class="outer"></div>
    <div class="target" id="target"></div>
    <div class="ring" id="ring"></div>
    <div class="beast" id="beast"></div>
  </div>
  <div class="info"><div id="cTip">Throw when the ring meets the dashed circle</div></div>
  <button class="btn" id="throwBtn">Throw orb</button>
  <button class="btn ghost" id="runBtn">Release</button>
</div>

<div class="drawer" id="dex">
  <button class="x" id="dexX">×</button>
  <h1 id="dexT">Dex</h1>
  <div class="sub">Specimen log</div>
  <div class="grid" id="dexG"></div>
  <div class="row"><span>Simulation mode</span><div class="sw" id="simSw"></div></div>
  <div class="row"><span>Reset progress</span><button class="btn ghost" id="reset">Reset</button></div>
</div>

<div class="gate" id="gate">
  <div class="eyebrow">Wildwalk</div>
  <h2 id="gT">Allow location</h2>
  <p id="gP"></p>
  <button class="btn" id="gTry">Enable location</button>
  <button class="btn ghost" id="gSim">Play in sim mode</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ================= Config ================= */
const LS='wildwalk.v1';
const CATCH_RANGE=50, STOP_RANGE=50, STOP_COOLDOWN=5*60e3;
const WINDOW=15*60e3, CELL=0.0018;
const DEFAULT_POS={lat:45.815,lng:15.982};

const SPECIES=[
 {n:'Mossling',e:'🌿',r:1},{n:'Puddlepip',e:'🐸',r:1},{n:'Bumbleroot',e:'🐝',r:1},{n:'Pebblet',e:'🪨',r:1},
 {n:'Gustling',e:'🐦',r:1},{n:'Snailwick',e:'🐌',r:1},
 {n:'Glimmoth',e:'🦋',r:2},{n:'Frostnib',e:'🐧',r:2},{n:'Sparkit',e:'🐹',r:2},{n:'Duskfox',e:'🦊',r:2},
 {n:'Cragon',e:'🐲',r:3},{n:'Tidalume',e:'🐙',r:3},{n:'Hootflare',e:'🦉',r:3},
 {n:'Lunaray',e:'🦄',r:4},{n:'Solwing',e:'🦅',r:4}
].map((s,i)=>({...s,id:i}));
const WEIGHT={1:60,2:28,3:10,4:2};
const RNAME={1:'Common',2:'Uncommon',3:'Rare',4:'Epic'};
const pips=r=>'●'.repeat(r)+'○'.repeat(4-r);

/* ================= State ================= */
const def={xp:0,orbs:10,dex:{},gone:{},stopCd:{},mission:null,mIdx:0};
let S=Object.assign({},def,JSON.parse(localStorage.getItem(LS)||'{}'));
let SIM=false;   // not saved: every launch starts on real GPS
const save=()=>localStorage.setItem(LS,JSON.stringify(S));
const $=id=>document.getElementById(id);
const level=x=>Math.floor(Math.sqrt(x/100))+1;
const lvStart=l=>(l-1)*(l-1)*100;

/* ================= Helpers ================= */
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hash=(a,b,c)=>{let h=2166136261;for(const v of [a,b,c]){h^=v;h=Math.imul(h,16777619);}return h>>>0;};
let tTimer;function toast(h,ms=2200){const t=$('toast');t.innerHTML=h;t.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),ms);}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';

/* ================= Map (vector tiles, sharp at any zoom) ================= */
const STYLE_URLS=['https://tiles.openfreemap.org/styles/dark','https://tiles.openfreemap.org/styles/positron'];
const FALLBACK_STYLE={version:8,sources:{esri:{type:'raster',tileSize:256,maxzoom:16,attribution:'Tiles © Esri',
  tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}']}},
  layers:[{id:'esri',type:'raster',source:'esri',paint:{'raster-brightness-max':.62,'raster-contrast':.5}}]};

/* Recolor any OpenMapTiles-based style into the black / white hairline look. */
function themeStyle(s){
  const has=(id,...w)=>w.some(x=>id.includes(x));
  s.layers.forEach(l=>{
    const id=(l.id||'').toLowerCase();l.paint=l.paint||{};l.layout=l.layout||{};
    const hide=()=>{l.layout.visibility='none';};
    switch(l.type){
      case 'background': l.paint['background-color']='#050608';delete l.paint['background-pattern'];break;
      case 'fill':
        delete l.paint['fill-pattern'];
        if(has(id,'water','ocean','sea','lake','river'))l.paint['fill-color']='#0c1218';
        else if(has(id,'building'))l.paint['fill-color']='#0d1015',l.paint['fill-outline-color']='#1b212a';
        else if(has(id,'park','wood','forest','grass','garden','green','nature','landcover'))l.paint['fill-color']='#0a0e0c';
        else l.paint['fill-color']='#080b0d';
        break;
      case 'fill-extrusion': l.paint['fill-extrusion-color']='#0d1015';delete l.paint['fill-extrusion-pattern'];break;
      case 'line':
        delete l.paint['line-pattern'];
        if(has(id,'casing','outline','bridge_casing')){hide();break;}
        if(has(id,'boundary','admin')){l.paint['line-color']='#262d36';break;}
        if(l['source-layer']==='transportation')l.paint['line-color']=['match',['get','class'],['path','pedestrian','steps','footway','cycleway'],'#2d343c',['rail','transit'],'#2a3038','#6f7984'];
        else if(has(id,'water'))l.paint['line-color']='#0c1218';
        else if(has(id,'motorway','trunk','primary','secondary','tertiary','minor','service','street','track','residential','road'))l.paint['line-color']='#6f7984';
        else if(has(id,'path','pedestrian','footway','steps','cycle'))l.paint['line-color']='#2d343c';
        else if(has(id,'rail','transit'))l.paint['line-color']='#2a3038';
        else l.paint['line-color']='#3a414a';
        break;
      case 'symbol':
        if(has(id,'poi','housenumber','shield','airport','aerodrome')||!l.layout['text-field']){hide();break;}
        l.paint['text-color']=has(id,'place','city','town','village','state','country','continent','suburb')?'#c7cfd8':has(id,'water')?'#4f5a66':'#8b96a2';
        l.paint['text-halo-color']='#000';l.paint['text-halo-width']=1.5;l.paint['icon-opacity']=0;
        if(has(id,'place','city','town','village','suburb')){l.layout['text-transform']='uppercase';l.layout['text-letter-spacing']=0.12;}
        break;
      case 'hillshade':case 'raster':case 'heatmap':case 'color-relief': hide();break;
    }
  });
  return s;
}
async function loadMapStyle(){
  for(const u of STYLE_URLS){
    try{const r=await fetch(u);if(!r.ok)continue;return themeStyle(await r.json());}catch(e){}
  }
  return FALLBACK_STYLE;
}

const map=new maplibregl.Map({
  container:'map',center:[DEFAULT_POS.lng,DEFAULT_POS.lat],zoom:17,minZoom:-2,maxZoom:19.5,
  style:{version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#050608'}}]},
  attributionControl:false,dragRotate:false,pitchWithRotate:false,touchPitch:false
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');

let player={...DEFAULT_POS}, gotFix=false;

function circleLine(c,r,n=72){
  const dLat=r/111320,dLng=r/(111320*Math.cos(c.lat*Math.PI/180)),pts=[];
  for(let i=0;i<=n;i++){const a=i/n*2*Math.PI;pts.push([c.lng+dLng*Math.cos(a),c.lat+dLat*Math.sin(a)]);}
  return {type:'Feature',geometry:{type:'LineString',coordinates:pts}};
}
function addRange(){
  if(map.getSource('range'))return;
  map.addSource('range',{type:'geojson',data:circleLine(player,CATCH_RANGE)});
  map.addLayer({id:'range',type:'line',source:'range',paint:{'line-color':'#ffffff','line-width':1,'line-dasharray':[2,3],'line-opacity':.85}});
}
map.on('style.load',addRange);
loadMapStyle().then(s=>map.setStyle(s,{diff:false}));

function mkMarker(html,lng,lat,onClick,z){
  const el=document.createElement('div');el.innerHTML=html;
  if(z)el.style.zIndex=z;
  if(onClick)el.addEventListener('click',e=>{e.stopPropagation();onClick();});else el.style.pointerEvents='none';
  const mk=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lng,lat]).addTo(map);
  return {mk,el};
}
const me=mkMarker('<div class="me"></div>',player.lng,player.lat,null,10);

function setReadout(){$('mode').textContent=SIM?'SIM':(gotFix?'GPS LOCK':'LOCATING');}
function setPlayer(lat,lng,pan){
  player={lat,lng};
  me.mk.setLngLat([lng,lat]);
  const src=map.getSource('range');if(src)src.setData(circleLine(player,CATCH_RANGE));
  if(pan)map.easeTo({center:[lng,lat],duration:600});
  setReadout();refresh();maybeFetchStops();ensureMission();renderMission();
}
map.on('click',e=>{if(SIM)setPlayer(e.lngLat.lat,e.lngLat.lng,false);});
map.on('dragstart',()=>document.body.dataset.follow='0');

/* ================= Location (asks on load) ================= */
let watchId=null;
const GATE={
  ask:['Allow location','Wildwalk places you on the map using your location. Tap Allow when your browser asks.'],
  denied:['Location is blocked','Tap the icon left of the address bar, then Permissions, then Location, and choose Allow. Make sure Location is also on in your phone quick settings. Then press Enable location.'],
  off:['Location is off','Turn on Location in your phone quick settings, then press Enable location.'],
  timeout:['Searching for GPS','No position yet. Go outside or next to a window, then press Enable location.']
};
function showGate(k){$('gT').textContent=GATE[k][0];$('gP').textContent=GATE[k][1];$('gate').classList.add('open');}
function hideGate(){$('gate').classList.remove('open');}
function onGPS(p){
  if(SIM)return;
  const first=!gotFix;gotFix=true;hideGate();
  setPlayer(p.coords.latitude,p.coords.longitude,!first&&document.body.dataset.follow==='1');
  if(first)map.jumpTo({center:[player.lng,player.lat],zoom:17});
}
function onGPSErr(e){
  if(gotFix||SIM)return;
  showGate(e.code===1?'denied':e.code===2?'off':'timeout');setReadout();
}
function startGPS(){
  if(!navigator.geolocation){showGate('off');return;}
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onGPS,onGPSErr,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
$('gTry').onclick=()=>{startGPS();};
$('gSim').onclick=()=>{hideGate();setSim(true);};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!gotFix&&!SIM)startGPS();});

/* ================= Spawns ================= */
const spawnMarkers={};
function spawnsAround(center,now=Date.now()){
  const win=Math.floor(now/WINDOW), out=[];
  const ci=Math.floor(center.lat/CELL);
  for(let i=ci-4;i<=ci+4;i++){
    const latC=(i+.5)*CELL, lngSize=CELL/Math.cos(latC*Math.PI/180);
    const cj=Math.floor(center.lng/lngSize);
    for(let j=cj-5;j<=cj+5;j++){
      const rnd=mulberry(hash(i,j,win)), c=rnd(), n=c<.3?0:c<.8?1:2;
      for(let k=0;k<n;k++){
        let w=rnd()*100,r=4;for(const rr of [1,2,3,4]){w-=WEIGHT[rr];if(w<0){r=rr;break;}}
        const pool=SPECIES.filter(s=>s.r===r),sp=pool[Math.floor(rnd()*pool.length)];
        const id=`${i}_${j}_${win}_${k}`;
        out.push({id,sp,lat:i*CELL+rnd()*CELL,lng:j*lngSize+rnd()*lngSize,expires:(win+1)*WINDOW});
      }
    }
  }
  return out;
}
const crHTML=(s,near)=>`<div class="cr r${s.sp.r}${near?' near':''}"><i></i><b>${s.sp.e}</b><span>${s.sp.n}</span></div>`;
function refresh(){
  const now=Date.now(),list=spawnsAround(player,now).filter(s=>!S.gone[s.id]&&dist(player,s)<900);
  const keep=new Set(list.map(s=>s.id));
  for(const id in spawnMarkers)if(!keep.has(id)){spawnMarkers[id].mk.remove();delete spawnMarkers[id];}
  for(const s of list){
    const near=dist(player,s)<=CATCH_RANGE;
    let o=spawnMarkers[s.id];
    if(!o){o=mkMarker(crHTML(s,near),s.lng,s.lat,()=>tapSpawn(s));o.near=near;spawnMarkers[s.id]=o;}
    else if(o.near!==near){o.near=near;o.el.innerHTML=crHTML(s,near);}
  }
  for(const id in S.gone){if(S.gone[id]<now-WINDOW*2)delete S.gone[id];}
  refreshStops();
}
function tapSpawn(s){
  const d=dist(player,s);
  if(d>CATCH_RANGE){toast(`${s.sp.n}<small>${Math.round(d)} m away · get within ${CATCH_RANGE} m</small>`);return;}
  openCatch(s);
}

/* ================= Catch minigame ================= */
let cur=null,raf=null,ringR=120;
const TARGET_R=40;
function openCatch(s){
  cur={s,misses:0};
  $('cName').textContent=s.sp.n;$('cSub').textContent=`${RNAME[s.sp.r]} · ${pips(s.sp.r)}`;
  $('beast').textContent=s.sp.e;
  $('cTip').textContent='Throw when the ring meets the dashed circle';
  $('target').style.width=$('target').style.height=TARGET_R*2+'px';
  $('catch').classList.add('open');startRing();updateHud();
}
function startRing(){
  cancelAnimationFrame(raf);const t0=performance.now();
  const speed=1500-cur.s.sp.r*180;
  const step=t=>{const p=((t-t0)%speed)/speed;ringR=125-(125-16)*p;
    const r=$('ring');r.style.width=r.style.height=ringR*2+'px';raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
}
function closeCatch(){cancelAnimationFrame(raf);$('catch').classList.remove('open');cur=null;refresh();}
$('runBtn').onclick=closeCatch;
$('throwBtn').onclick=()=>{
  if(!cur)return;
  if(S.orbs<=0){toast('Out of orbs<small>Visit a stop to resupply</small>',2600);closeCatch();return;}
  S.orbs--;
  const tol=22-cur.s.sp.r*3, off=Math.abs(ringR-TARGET_R);
  if(off<=tol){
    const sp=cur.s.sp,great=off<=tol/3;
    const cp=Math.round(sp.r*120+Math.random()*180+(great?40:0));
    const d=S.dex[sp.id]||{count:0,best:0};d.count++;d.best=Math.max(d.best,cp);S.dex[sp.id]=d;
    const old=level(S.xp),xp=40*sp.r+(d.count===1?100:0)+(great?25:0);S.xp+=xp;
    S.gone[cur.s.id]=Date.now();save();
    vib([60,40,120]);
    const note=missionEvent('catch',{r:sp.r});
    toast(`${great?'Perfect · ':''}Captured ${sp.n}<small>CP ${cp} · +${xp} XP${d.count===1?' · new specimen':''}${level(S.xp)>old?` · level ${level(S.xp)}`:''}${note?' · '+note:''}</small>`,3400);
    closeCatch();
  }else{
    cur.misses++;vib(80);
    if(cur.misses>=3){S.gone[cur.s.id]=Date.now();save();toast(`${cur.s.sp.n} escaped`);closeCatch();}
    else{$('cTip').textContent=`Missed · ${3-cur.misses} attempts left`;save();}
  }
  updateHud();
};

/* ================= Stops (OpenStreetMap via Overpass) ================= */
let stops=[],stopMarkers={},lastFetch=null,fetching=false,warned=false,stopsReady=false;
const STOP_EMOJI={museum:'🏛️',artwork:'🎨',viewpoint:'🔭',attraction:'⭐',gallery:'🖼️',park:'🌳',cafe:'☕',library:'📚',fountain:'⛲',place_of_worship:'⛪',monument:'🗿',memorial:'🕯️'};
function stopEmoji(t){for(const k of [t.tourism,t.leisure,t.amenity,t.historic])if(k&&STOP_EMOJI[k])return STOP_EMOJI[k];return '◆';}
async function maybeFetchStops(){
  if(fetching)return;
  if(lastFetch&&dist(player,lastFetch)<300)return;
  const key='ww.stops.'+player.lat.toFixed(3)+'.'+player.lng.toFixed(3);
  const cached=localStorage.getItem(key);
  if(cached){stops=JSON.parse(cached);lastFetch={...player};stopsReady=true;refreshStops();ensureMission();return;}
  fetching=true;
  const a=`(around:700,${player.lat},${player.lng})`;
  const q=`[out:json][timeout:20];(node${a}[tourism~"museum|artwork|viewpoint|attraction|gallery"];node${a}[leisure=park];node${a}[amenity~"cafe|library|fountain|place_of_worship"];node${a}[historic~"monument|memorial"];);out 40;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
    const j=await r.json();
    stops=j.elements.map(e=>({id:'n'+e.id,lat:e.lat,lng:e.lon,name:e.tags.name||'Landmark',e:stopEmoji(e.tags)}));
    try{localStorage.setItem(key,JSON.stringify(stops));}catch(_){}
    lastFetch={...player};
  }catch(e){if(!warned){warned=true;toast('Could not load stops<small>Check your connection</small>',2800);}}
  fetching=false;stopsReady=true;refreshStops();ensureMission();
}
const stopHTML=(s,cd,near,tgt)=>`<div class="stop${cd?' cd':''}${near&&!cd?' near':''}${tgt?' target':''}"><b>${s.e}</b></div>`;
function refreshStops(){
  const now=Date.now(),m=S.mission,list=stops.slice();
  if(m&&m.type==='visit'&&!list.find(x=>x.id===m.id))list.push({id:m.id,lat:m.lat,lng:m.lng,name:m.name,e:m.e});
  const ids=new Set(list.map(s=>s.id));
  for(const id in stopMarkers)if(!ids.has(id)){stopMarkers[id].mk.remove();delete stopMarkers[id];}
  for(const s of list){
    const cd=(S.stopCd[s.id]||0)>now-STOP_COOLDOWN, near=dist(player,s)<=STOP_RANGE, tgt=!!(m&&m.type==='visit'&&m.id===s.id);
    const key=''+cd+near+tgt;
    let o=stopMarkers[s.id];
    if(!o){o=mkMarker(stopHTML(s,cd,near,tgt),s.lng,s.lat,()=>tapStop(s));o.key=key;stopMarkers[s.id]=o;}
    else if(o.key!==key){o.key=key;o.el.innerHTML=stopHTML(s,cd,near,tgt);}
  }
}
function tapStop(s){
  const d=dist(player,s);
  if(d>STOP_RANGE){toast(`${s.name}<small>${Math.round(d)} m away · get within ${STOP_RANGE} m</small>`);return;}
  const last=S.stopCd[s.id]||0,left=STOP_COOLDOWN-(Date.now()-last);
  if(left>0){toast(`${s.name}<small>Recharging · ${Math.ceil(left/60000)} min</small>`);return;}
  const n=3+Math.floor(Math.random()*3),xp=25;
  S.orbs+=n;S.xp+=xp;S.stopCd[s.id]=Date.now();save();vib(60);
  const note=missionEvent('visit',{id:s.id});
  toast(`${s.name}<small>+${n} orbs · +${xp} XP${note?' · '+note:''}</small>`,3000);
  updateHud();refreshStops();
}

/* ================= Missions ================= */
const MORDER=['visit','catch','visit','rare'];
function newMission(){
  let type=MORDER[S.mIdx%MORDER.length];
  if(type==='visit'){
    const now=Date.now();
    const c=stops.filter(s=>(S.stopCd[s.id]||0)<now-STOP_COOLDOWN).map(s=>({s,d:dist(player,s)}))
      .filter(o=>o.d>STOP_RANGE+10&&o.d<900)
      .sort((a,b)=>((a.s.name==='Landmark')-(b.s.name==='Landmark'))||a.d-b.d);
    if(c.length){const s=c[0].s;return {type:'visit',id:s.id,name:s.name,e:s.e,lat:s.lat,lng:s.lng,xp:60};}
    type='catch';
  }
  if(type==='catch')return {type:'catch',need:3,have:0,xp:80};
  return {type:'rare',need:1,have:0,minR:2,xp:120};
}
function ensureMission(){
  if(S.mission&&S.mission.type==='visit'&&dist(player,S.mission)>2500)S.mission=null;
  if(!S.mission){
    if(MORDER[S.mIdx%MORDER.length]==='visit'&&!stopsReady)return;
    S.mission=newMission();save();refreshStops();
  }
}
function missionEvent(kind,data){
  const m=S.mission;if(!m)return '';
  let done=false;
  if(kind==='visit'&&m.type==='visit'&&m.id===data.id)done=true;
  if(kind==='catch'){
    if(m.type==='catch'){m.have++;done=m.have>=m.need;}
    else if(m.type==='rare'&&data.r>=m.minR){m.have++;done=m.have>=m.need;}
  }
  if(done){
    const x=m.xp;S.xp+=x;S.mIdx++;S.mission=null;save();ensureMission();renderMission();updateHud();
    return `mission complete +${x} XP`;
  }
  save();renderMission();return '';
}
function renderMission(){
  const m=S.mission,t=$('mt'),d=$('md');
  if(!m){t.textContent='Scanning for missions';d.textContent='';return;}
  if(m.type==='visit'){
    t.textContent='Travel to '+m.name;
    const x=dist(player,m);d.textContent=x<=STOP_RANGE?'IN RANGE':fmtD(x);
  }else if(m.type==='catch'){t.textContent=`Capture ${m.need} creatures`;d.textContent=`${m.have}/${m.need}`;}
  else{t.textContent='Capture 1 uncommon or better';d.textContent=`${m.have}/${m.need}`;}
}
$('mq').onclick=()=>{
  const m=S.mission;
  if(m&&m.type==='visit'){document.body.dataset.follow='0';map.easeTo({center:[m.lng,m.lat],duration:700});}
};

/* ================= HUD / Dex ================= */
function updateHud(){
  const l=level(S.xp),a=lvStart(l),b=lvStart(l+1);
  $('lvl').textContent='LV '+String(l).padStart(2,'0');
  $('xpbar').style.width=((S.xp-a)/(b-a)*100)+'%';
  $('orbs').textContent='ORB '+S.orbs;
  save();
}
function renderDex(){
  const have=Object.keys(S.dex).length;
  $('dexT').textContent=`Dex ${String(have).padStart(2,'0')}/${SPECIES.length}`;
  $('dexG').innerHTML=SPECIES.map(s=>{const d=S.dex[s.id];
    return `<div class="card r${s.r}${d?'':' no'}"><span class="e">${s.e}</span><b>${d?s.n:'Unknown'}</b><span class="pips">${pips(s.r)}</span>${d?`CP ${d.best} · x${d.count}`:RNAME[s.r]}</div>`;}).join('');
  $('simSw').classList.toggle('on',SIM);
}
$('bDex').onclick=()=>{renderDex();$('dex').classList.add('open');};
$('dexX').onclick=()=>$('dex').classList.remove('open');
$('reset').onclick=()=>{if(confirm('Reset all progress?')){localStorage.removeItem(LS);location.reload();}};
$('bLoc').onclick=()=>{document.body.dataset.follow='1';map.easeTo({center:[player.lng,player.lat],zoom:Math.max(map.getZoom(),17),duration:600});};

function setSim(on){
  SIM=on;
  $('bSim').classList.toggle('on',on);$('hint').style.display=on?'block':'none';
  $('simSw').classList.toggle('on',on);setReadout();
  if(!on&&!gotFix)startGPS();
}
$('bSim').onclick=()=>setSim(!SIM);
$('simSw').onclick=()=>setSim(!SIM);

/* ================= Boot ================= */
document.body.dataset.follow='1';
updateHud();setReadout();renderMission();
refresh();maybeFetchStops();
(async()=>{
  let state='prompt';
  try{
    const p=await navigator.permissions.query({name:'geolocation'});
    state=p.state;
    p.onchange=()=>{if(p.state==='granted'&&!gotFix&&!SIM)startGPS();};
  }catch(e){}
  if(state!=='granted')showGate(state==='denied'?'denied':'ask');
  startGPS();
})();
setInterval(()=>{refresh();ensureMission();renderMission();},10000);
</script>
